<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Happy Birthday Mummy! 💐</title>

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;600&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --pink1: #ffd1e6;
      --pink2: #ff9fcf;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(
        135deg,
        var(--pink1),
        var(--pink2)
      );

      display: flex;
      align-items: center;
      justify-content: center;

      overflow-x: hidden;
      overflow-y: auto;

      padding: 25px 15px;
    }


    /* =========================
       MAIN HEADING
       ========================= */

    h1 {
      font-size: 4rem;
      margin: 0;

      color: #fff;

      text-align: center;

      font-family: 'Dancing Script', cursive;

      text-shadow:
        0 0 10px #fff,
        0 0 20px #ff69b4;

      animation:
        glow 2s ease-in-out infinite alternate;
    }


    @keyframes glow {

      from {
        text-shadow:
          0 0 10px #fff,
          0 0 20px #ff69b4;
      }

      to {
        text-shadow:
          0 0 20px #fff,
          0 0 40px #ff1493;
      }

    }


    /* =========================
       FALLING EMOJIS
       ========================= */

    .emoji-fall {

      position: fixed;

      top: 0;
      left: 0;
      right: 0;
      bottom: 0;

      pointer-events: none;

      overflow: hidden;

      z-index: 1;
    }


    .emoji {

      position: absolute;

      top: -10vh;

      font-size: 30px;

      animation:
        fall linear infinite;
    }


    @keyframes fall {

      to {
        transform:
          translateY(110vh)
          rotate(360deg);
      }

    }


    /* =========================
       CONFETTI
       ========================= */

    canvas {

      position: fixed;

      left: 0;
      top: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;

      z-index: 2;
    }


    /* =========================
       BIRTHDAY CARD
       ========================= */

    .card {

      position: relative;

      z-index: 3;

      width: min(900px, 95vw);

      max-height: 90vh;

      padding: 35px 30px;

      border-radius: 25px;

      background:
        rgba(255, 255, 255, 0.15);

      backdrop-filter:
        blur(12px);

      -webkit-backdrop-filter:
        blur(12px);

      border:
        1px solid rgba(255, 255, 255, 0.3);

      box-shadow:
        0 8px 40px
        rgba(0, 0, 0, 0.15);

      text-align: center;

      overflow-y: auto;
    }


    /* =========================
       BUTTON
       ========================= */

    .btn {

      margin-top: 20px;

      padding: 13px 28px;

      border: none;

      border-radius: 30px;

      background: #fff;

      color: #ff69b4;

      font-weight: 600;

      cursor: pointer;

      font-size: 1rem;

      box-shadow:
        0 4px 15px
        rgba(255, 255, 255, 0.3);

      transition:
        transform 0.2s,
        box-shadow 0.2s;
    }


    .btn:hover {

      transform:
        scale(1.07);

      box-shadow:
        0 6px 20px
        rgba(255, 255, 255, 0.5);
    }


    .btn:active {

      transform:
        scale(0.97);
    }


    /* =========================
       MESSAGE / POEM
       ========================= */

    .message {

      margin-top: 25px;

      font-family:
        'Dancing Script',
        cursive;

      font-size: 1.65rem;

      line-height: 1.6;

      color: #fff;

      white-space: pre-wrap;

      text-shadow:
        0 0 5px #fff;

      padding: 0 10px;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      body {

        padding:
          15px 10px;
      }


      .card {

        width: 100%;

        max-height: 92vh;

        padding:
          25px 18px;

        border-radius:
          20px;
      }


      h1 {

        font-size:
          2.7rem;
      }


      .message {

        font-size:
          1.25rem;

        line-height:
          1.55;

        padding:
          0 3px;
      }


      .emoji {

        font-size:
          24px;
      }

    }

  </style>
</head>


<body>


  <!-- =====================================
       FALLING EMOJIS
       ===================================== -->

  <div
    class="emoji-fall"
    id="emojiLayer">
  </div>


  <!-- =====================================
       CONFETTI
       ===================================== -->

  <canvas
    id="confetti">
  </canvas>


  <!-- =====================================
       BIRTHDAY CARD
       ===================================== -->

  <div class="card">

    <h1>
      Happy Birthday Mummy! 💐
    </h1>


    <button
      class="btn"
      id="revealBtn">

      Click here 💖

    </button>


    <div
      id="message"
      class="message">
    </div>

  </div>


  <!-- =====================================
       BACKGROUND MUSIC

       Your files should be:

       project/
       ├── index.html
       └── song.mp3

       ===================================== -->

  <audio
    id="bgMusic"
    loop>

    <source
      src="solarflex-happy-birthday-588990.mp3"
      type="audio/mpeg">

    Your browser does not support
    the audio element.

  </audio>


  <script>


    /* =====================================
       FALLING EMOJIS
       ===================================== */

    const emojis = [

      "☺️",
      "😊",
      "😍",
      "😘",
      "🤗",
      "💖",
      "💝",
      "💐",
      "💞",
      "💕",
      "💓",
      "💜",
      "💛",
      "🫶"

    ];


    function createEmojis() {

      const layer =
        document.getElementById(
          'emojiLayer'
        );


      for (
        let i = 0;
        i < 40;
        i++
      ) {

        const e =
          document.createElement(
            'div'
          );


        e.className =
          'emoji';


        e.innerText =
          emojis[
            Math.floor(
              Math.random() *
              emojis.length
            )
          ];


        e.style.left =
          Math.random() * 100 + '%';


        e.style.animationDuration =
          (6 + Math.random() * 5) +
          's';


        e.style.animationDelay =
          (Math.random() * 5) +
          's';


        layer.appendChild(e);

      }

    }



    /* =====================================
       CONFETTI EFFECT
       ===================================== */

    function confetti() {

      const canvas =
        document.getElementById(
          'confetti'
        );


      const ctx =
        canvas.getContext('2d');


      let w =
        canvas.width =
        window.innerWidth;


      let h =
        canvas.height =
        window.innerHeight;


      window.addEventListener(
        'resize',
        () => {

          w =
            canvas.width =
            window.innerWidth;


          h =
            canvas.height =
            window.innerHeight;

        }
      );


      const conf = [];


      for (
        let i = 0;
        i < 150;
        i++
      ) {

        conf.push({

          x:
            Math.random() * w,

          y:
            Math.random() * h,

          dx:
            Math.random() * 2 - 1,

          dy:
            Math.random() * 3 + 2,

          color:
            `hsl(
              ${Math.random() * 360},
              100%,
              70%
            )`,

          size:
            Math.random() * 6 + 2

        });

      }


      function draw() {

        ctx.clearRect(
          0,
          0,
          w,
          h
        );


        conf.forEach(c => {

          ctx.fillStyle =
            c.color;


          ctx.fillRect(
            c.x,
            c.y,
            c.size,
            c.size
          );


          c.x += c.dx;

          c.y += c.dy;


          if (c.y > h) {

            c.y = -10;

            c.x =
              Math.random() * w;

          }

        });


        requestAnimationFrame(
          draw
        );

      }


      draw();

    }



    /* =====================================
       TYPEWRITER MESSAGE
       ===================================== */

    function revealMessage() {

      const msg =
        document.getElementById(
          'message'
        );


      /*
        IMPORTANT:
        Backticks ` ` are used here
        because the poem contains
        multiple lines.
      */

      const text = `For a very special lady 🫠😎😘

In every storm, you were my shelter,
In every darkness, my guiding light.
You turned our sadness into joy,
And made everything feel alright.

Your hands have held so many burdens,
Yet your smile has never ceased to shine.
If love could take a human form,
I know that it would look like you.

You are my comfort, my strength, my grace,
The warmth that no one can replace.
And if I could choose my mother again,
I'd choose you in every life, every time. ❤️

Happy Birthday, Mummy. 💐`;


      msg.textContent = "";


      let i = 0;


      function type() {

        if (
          i < text.length
        ) {

          msg.textContent +=
            text.charAt(i);


          i++;


          setTimeout(
            type,
            35
          );

        }

      }


      type();

    }



    /* =====================================
       START ANIMATIONS
       ===================================== */

    createEmojis();

    confetti();



    /* =====================================
       BUTTON
       ===================================== */

    document
      .getElementById(
        'revealBtn'
      )
      .addEventListener(
        'click',
        function () {


          /* Show poem */

          revealMessage();


          /* Start music */

          const music =
            document.getElementById(
              'bgMusic'
            );


          music
            .play()
            .catch(error => {

              console.log(
                "Audio could not play:",
                error
              );

            });


          /* Change button text */

          this.textContent =
            "Happy Birthday, Mummy! 💖";


        }
      );

  </script>

</body>
</html>
